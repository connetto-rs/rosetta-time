[package]
name = "rosetta-time"
version = "0.1.1"
edition = "2024"
description = "Wrappers of jiff's civil Date and Time and of Span providing serde and binary diesel bindings for SQLite and PostgreSQL."
license = "MIT"
readme = "README.md"
repository = "https://github.com/connetto-rs/rosetta-time"
keywords = ["jiff", "diesel", "postgres", "sqlite", "interval"]
categories = ["database", "date-and-time", "encoding"]

[dependencies]
diesel = { version = "2.3.13", optional = true, default-features = false }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
thiserror = { version = "2.0", optional = true }

[features]
default = []
serde = ["dep:serde", "jiff/serde"]
diesel = ["dep:diesel"]
postgres = ["diesel", "diesel/postgres", "dep:thiserror"]
sqlite = ["diesel", "diesel/sqlite", "dep:thiserror"]
wasm = ["jiff/js"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
chrono = "0.4"
diesel = { version = "2.3.13", default-features = false, features = ["chrono"] }
serde_json = "1.0"
wasm-bindgen-test = "0.3"

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
clone_on_copy = "forbid"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
pedantic = { level = "deny", priority = -1 }
